# Sprite Lore install settings.
#
# Leave a value empty to auto-detect it. To set your own values, either edit
# this file or (better, so an update doesn't overwrite them) put the same
# section/key lines in config.local.ini next to it. config.local.ini wins.
#
# After installing, the paths are kept in ~/.config/spritelore/spritelore_local.json,
# which the server, anime2img and the command-line tools read. Re-run the
# installer to change them.

[paths]
# Where the Sprite Lore server and its data (settings, profiles, character
# guides) live. Default: ~/.local/share/spritelore
install_dir =

# SillyTavern folder (the one with server.js and public/). Checked by default:
# ~/SillyTavern, ~/sillytavern, ~/Documents/SillyTavern,
# ~/SillyTavern-Launcher/SillyTavern, /opt/SillyTavern
sillytavern =
# SillyTavern user folder name under data/ (multi-user installs)
st_user = default-user

# ComfyUI folder (the one with main.py and custom_nodes/). Checked by default:
# ~/ComfyUI, ~/comfy/ComfyUI, ~/Documents/ComfyUI, ~/ComfyUI_windows_portable/ComfyUI, /opt/ComfyUI
comfyui =
# Where Sprite Lore puts ComfyUI copies of prompted images. Default: <comfyui>/input
comfy_input =

# Optional: a CharacterVault source checkout to add the Sprite Lore page to.
# Empty = skip (Sprite Lore also runs on its own at http://127.0.0.1:<port>/).
charactervault =

# anime2img folder. Empty = your own copy if one is in ~/anime2img,
# ~/Documents/anime2img or ~/Desktop/anime2img, otherwise the copy bundled
# with Sprite Lore (<install_dir>/anime2img). Set it to use your own templates.
anime2img_dir =
# Where anime2img moves images it couldn't prompt. Default: <anime2img_dir>/failed
failed_dir =

# Extra sprite folders to show besides SillyTavern's characters folder,
# separated by ;   e.g.  ~/Pictures/Sprites; /mnt/data/Characters
sprite_roots =

[backends]
# OpenAI-compatible endpoints (KoboldCpp, llama.cpp server, LM Studio, ...).
# The vision one needs a model with image input (mmproj).
vision_url = http://127.0.0.1:5001/v1
lore_url = http://127.0.0.1:5001/v1

[server]
port = 5181
# yes = run the server as a systemd user service that starts at login (Linux)
service = yes

[install]
# set to no to skip a part
sillytavern_extension = yes
comfyui_nodes = yes
charactervault_page = yes
